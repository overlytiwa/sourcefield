name: Source checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - run: npm run test:core
      - name: Check Windows installer and terminal launcher packaging
        if: runner.os == 'Windows'
        run: |
          node scripts/package.mjs --win --publish never
          if (!(Test-Path release/win-unpacked/sourcefield.cmd)) { throw 'Terminal launcher is missing from the package' }
          if (!(Test-Path release/win-unpacked/sourcefield-path.ps1)) { throw 'Terminal registration helper is missing from the package' }
          if (!(Test-Path release/win-unpacked/resources/skills/sourcefield/SKILL.md)) { throw 'Sourcefield skill is missing from the package' }
      - run: xvfb-run -a npm run smoke:desktop
        if: runner.os == 'Linux'
